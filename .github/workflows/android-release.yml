name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name=mayak --org=kz.mayak .
          rm -f test/widget_test.dart

      - name: Generate branded launcher icons and app label
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_icon.py
          python tools/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mayak-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          ASSET="Mayak-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${ASSET}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ASSET}" --clobber
          else
            gh release create "${VERSION}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "Маяк ${VERSION} · Android beta" \
              --notes "Первая локальная бета: стиль Маяка, создание планов поездки и хранение на телефоне. Общий сервер и реальные совпадения пока не подключены."
          fi
